name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package skills
        run: |
          mkdir dist
          for dir in skills/*/; do
            name=$(basename "$dir")
            (cd skills && zip -qr "../dist/$name.skill" "$name")
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.skill --generate-notes
